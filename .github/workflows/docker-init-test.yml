name: Docker initialisation Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  docker-init-test:
    name: Test Docker Container initialisation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and start services
        run: |
          docker compose up -d mysql
          echo "MySQL service started, waiting for it to be ready..."

      - name: Wait for MySQL to be ready
        run: |
          timeout 60s bash -c 'until docker exec $(docker compose ps -q mysql) mysqladmin ping -h localhost -ptowertrackpass --silent; do echo "Waiting for MySQL..."; sleep 3; done'
          echo "MySQL is ready"

      - name: Start towertrack container
        run: |
          docker compose --profile main up --build -d
          echo "Towertrack container started"

      - name: Wait for Database and Listener initialisation
        run: |
          echo "Waiting for database and listener to be healthy..."
          timeout 60s bash -c '
            until [ "$(docker inspect -f {{.State.Health.Status}} $(docker-compose ps -q mysql))" = "healthy" ]; do
              sleep 5
              echo "Still waiting for MySQL to be healthy..."
            done
          ' || exit 1
          echo "MySQL is healthy"
          echo "Waiting for Towertrack to be healthy..."
          timeout 60s bash -c '
            until [ "$(docker inspect -f {{.State.Health.Status}} $(docker-compose ps -q towertrack))" = "healthy" ]; do
              sleep 5
              echo "Still waiting for Towertrack to be healthy..."
            done
          ' || exit 1
          echo "Towertrack is healthy"

      - name: Wait and check for successful initialisation
        run: |
          echo "Waiting for initialisation to complete..."
          timeout 90s bash -c '
            until docker-compose logs towertrack | grep -q "\[ SUCCESS \] Database and tables initialisation completed"; do
              sleep 5
              echo "Still waiting for initialisation..."
              if ! docker-compose ps | grep -q "towertrack.*Up"; then
                echo "❌ Container exited before initialisation completed"
                docker-compose logs towertrack
                exit 1
              fi
            done
          ' || exit 1
          
          echo "✅ Success! Found database initialisation completion message"
          docker-compose logs towertrack | grep "\[ SUCCESS \] Database and tables initialisation completed" -A 3 -B 3

      - name: Show logs on failure
        if: failure()
        run: |
          echo "==== Docker Compose Status ===="
          docker-compose ps
          echo "==== Container Logs ===="
          docker-compose logs

      - name: Clean up
        if: always()
        run: docker-compose down -v